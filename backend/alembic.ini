# Alembic configuration — run commands from the backend/ directory:
#   poetry run alembic upgrade head
#   poetry run alembic revision --autogenerate -m "description"

[alembic]
script_location = migrations
prepend_sys_path = src
version_path_separator = os

# sqlalchemy.url is set programmatically in migrations/env.py from DATABASE_URL.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
