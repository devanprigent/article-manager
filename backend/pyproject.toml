[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src"]
exclude = [".venv", "__pycache__", ".pytest_cache"]
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src/app"]
strict = false
warn_return_any = true
warn_unused_ignores = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = "app.models"
disable_error_code = ["name-defined"]
[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [
    {name = "devan",email = "devan.prgt@gmail.com"}
]
requires-python = ">=3.12,<4"
dependencies = [
    "alembic (==1.18.4)",
    "gunicorn (==26.0.0)",
    "psycopg[binary] (==3.3.4)",
    "pydantic (==2.13.4)",
    "python-dotenv (==1.2.2)",
    "beautifulsoup4 (==4.14.3)",
    "requests (==2.34.2)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "pyjwt (>=2.13.0,<3.0.0)",
    "fastapi (>=0.137.2,<0.138.0)",
    "uvicorn (>=0.49.0,<0.50.0)",
    "pwdlib[argon2] (>=0.3.0,<0.4.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (==9.0.3)",
    "ruff (==0.15.12)",
    "mypy (==2.1.0)",
    "types-requests (==2.33.0.20260518)",
    "pre-commit (==4.6.0)",
    "httpx2 (>=2.4.0,<3.0.0)"
]

[tool.poetry]
package-mode = false