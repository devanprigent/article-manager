services:
  database:
    image: postgres:16
    container_name: article_manager_database
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: article_manager
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d article_manager"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: article_manager_migrate
    env_file:
      - ./backend/.env.example
    command: poetry run alembic upgrade head
    restart: "no"
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://user:password@database:5432/article_manager

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: article_manager_backend
    env_file:
      - ./backend/.env.example
    ports:
      - "5000:5000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg://user:password@database:5432/article_manager

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: article_manager_frontend
    env_file:
      - ./frontend/.env.example
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
